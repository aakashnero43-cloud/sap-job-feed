name: nightly-job-feed

on:
  schedule:
    # 21:00 UTC = 02:30 IST, well before the 08:30 IST Claude scan reads jobs.json
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      hours_old:
        description: "Look-back window in hours (use 720 for the first seed run)"
        default: "96"
        required: false

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Scrape
        env:
          FEED_HOURS_OLD: ${{ github.event.inputs.hours_old || '96' }}
        run: python scraper/scrape.py

      - name: Commit feed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/jobs.json data/seen.json data/SUMMARY.md
          git diff --cached --quiet && echo "no change" || git commit -m "feed: $(date -u +%F)"
          git pull --rebase --autostash origin main || true
          git push
